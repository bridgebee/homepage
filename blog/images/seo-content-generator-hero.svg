<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">A single piece of Japanese brand content expanding into localized content across Southeast Asian marketplaces</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C1CE0"/>
      <stop offset="45%" stop-color="#5417C4"/>
      <stop offset="100%" stop-color="#2C1660"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bgGrad)"/>

  <!-- decorative circles -->
  <circle cx="1080" cy="90" r="140" fill="none" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="1150" cy="430" r="100" fill="none" stroke="rgba(255,255,255,0.12)"/>

  <!-- source: single JP content node -->
  <g transform="translate(110,235)">
    <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="#FFFFFF"/>
    <text x="45" y="60" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="26" fill="#6414DC">JP</text>
  </g>
  <text x="155" y="380" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF" opacity="0.85">One brand story</text>

  <!-- flow paths to 4 marketplace nodes -->
  <path d="M200 275 C 320 200, 420 170, 520 165" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <path d="M200 280 C 320 260, 420 250, 520 255" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <path d="M200 288 C 320 330, 420 355, 520 360" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>
  <path d="M200 292 C 320 400, 420 440, 520 450" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none"/>

  <!-- 4 localized market nodes -->
  <g font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="20">
    <g transform="translate(520,120)">
      <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="#ED7D31"/>
      <text x="45" y="60" text-anchor="middle" fill="#FFFFFF">TH</text>
    </g>
    <g transform="translate(520,210)">
      <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="#FFC629"/>
      <text x="45" y="60" text-anchor="middle" fill="#2C1660">ID</text>
    </g>
    <g transform="translate(520,315)">
      <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="#FFFFFF"/>
      <text x="45" y="60" text-anchor="middle" fill="#6414DC">MY</text>
    </g>
    <g transform="translate(520,405)">
      <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="rgba(255,255,255,0.85)"/>
      <text x="45" y="60" text-anchor="middle" fill="#6414DC">VN</text>
    </g>
  </g>

  <!-- growth chart on the right -->
  <g transform="translate(720,150)">
    <rect x="0" y="0" width="380" height="270" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.75)" letter-spacing="1">MARKETPLACE VISIBILITY</text>
    <polyline points="24,210 90,180 150,190 210,140 270,120 330,70" fill="none" stroke="#FFC629" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="70" r="7" fill="#FFC629"/>
    <line x1="24" y1="230" x2="356" y2="230" stroke="rgba(255,255,255,0.25)"/>
    <text x="24" y="255" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">Week 1</text>
    <text x="300" y="255" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">Week 12</text>
  </g>

  <text x="600" y="510" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.65)">One brand voice, localized across every Southeast Asian marketplace</text>
</svg>
